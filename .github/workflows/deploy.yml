name: Deploy API to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/promofm-api
            git pull origin main
            npm ci --omit=dev
            sudo systemctl restart promofm-api
            ok=0
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:3000/server/health > /dev/null; then
                echo "Health OK after attempt ${i}"; ok=1; break
              fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "Health check FAILED after 30s"; exit 1
            fi
